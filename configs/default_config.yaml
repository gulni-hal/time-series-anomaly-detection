paths:
  data_raw_dir: "data/raw/"
  data_processed_dir: "data/processed/"
  outputs_dir: "outputs/"
  logs_dir: "logs/"

datasets:
  swat: "11-Mar-2026_0900_1700.csv"
  wadi_train: "WADI_14days_new.csv"
  wadi_test: "WADI_attackdataLABLE.csv"

split_ratios:
  train: 0.60
  validation: 0.20
  test: 0.20

training:
  max_epochs: 50
  batch_size: 32
  early_stopping_patience: 5
  random_seeds: [42, 123, 2026, 7, 999]

automata:
  window_size: 4
  alphabet_size: 3
  experiment_window_sizes: [3, 4, 5, 6]
  experiment_alphabet_sizes: [3, 4, 5, 6]

noise:
  type: "gaussian"
  mean: 0.0
  std_dev: 0.1
