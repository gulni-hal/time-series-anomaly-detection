paths:
  data_raw_dir: "data/raw/"
  data_processed_dir: "data/processed/"
  outputs_dir: "outputs/"
  logs_dir: "logs/"
  swat_file: "11-Mar-2026_0900_1700.csv"
  wadi_file: "WADI_attackdataLABLE.csv"

active_datasets:
  - "SKAB"
  - "BATADAL"

datasets:
  skab_folder: "SKAB/"
  batadal_file: "BATADAL/BATADAL_Training2.csv"
  skab_label: "anomaly"
  batadal_label: "ATT_FLAG"
  swat_label: "Normal/Attack"
  wadi_label: "attack_label"

split_ratios:
  train: 0.60
  validation: 0.20
  test: 0.20

training:
  max_epochs: 50
  batch_size: 32
  early_stopping_patience: 5
  random_seeds: [42, 123, 2026, 7, 999]
  prediction_thresholds:
    SKAB: 0.15
    BATADAL: 0.05
    default: 0.10

automata:
  window_size: 4
  alphabet_size: 3
  experiment_window_sizes: [3, 4, 5, 6]
  experiment_alphabet_sizes: [3, 4, 5, 6]

noise:
  type: "gaussian"
  mean: 0.0
  std_dev: 0.1
