paths:
  data_raw_dir: "data/raw/"
  data_processed_dir: "data/processed/"
  outputs_dir: "outputs/"
  logs_dir: "logs/"

datasets:
  skab_folder: "SKAB/"
  batadal_file: "BATADAL/BATADAL_Training2.csv"
  skab_label: "anomaly"
  batadal_label: "ATT_FLAG"

split_ratios:
  train: 0.60
  validation: 0.20
  test: 0.20

training:
  max_epochs: 50
  batch_size: 32
  early_stopping_patience: 5
  random_seeds: [42, 123, 2026, 7, 999]

automata:
  window_size: 4
  alphabet_size: 3
  experiment_window_sizes: [3, 4, 5, 6]
  experiment_alphabet_sizes: [3, 4, 5, 6]

noise:
  type: "gaussian"
  mean: 0.0
  std_dev: 0.1
